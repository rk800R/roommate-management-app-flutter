# Bounded JVM Memory Configuration (~2 GB for Gradle, smaller for Kotlin daemon)
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Keep build memory predictable on this machine
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=false

# Daemon & Worker Optimizations
org.gradle.daemon=true
org.gradle.workers.max=2

# AndroidX & Jetifier
android.useAndroidX=true
android.enableJetifier=false

# In-Process Kotlin & DEX Compilation
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
# In case any external Kotlin compile daemon is ever spawned, keep its heap bounded too
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=384m
android.enableD8.desugaring=true