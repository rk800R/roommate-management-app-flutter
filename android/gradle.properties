# Optimized JVM Memory Configuration
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:+HeapDumpOnOutOfMemoryError

# Parallel Execution & Caching
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=false

# Daemon & Worker Optimizations
org.gradle.daemon=true
org.gradle.workers.max=4

# AndroidX & Jetifier
android.useAndroidX=true
android.enableJetifier=false

# In-Process Kotlin & DEX Compilation
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process
android.enableD8.desugaring=true